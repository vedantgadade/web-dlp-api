<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VGSAVE — Free Video Downloader</title>
<meta name="description" content="VGSAVE downloads public videos and audio in available qualities.">
<style>
*{box-sizing:border-box}body{margin:0;background:#061322;color:#f7fafc;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
main{width:min(820px,92%);margin:0 auto;padding:70px 0 80px}
.badge{display:inline-block;border:1px solid #27425d;background:#0b1b2c;border-radius:999px;padding:11px 18px;color:#b9c8d8;font-size:15px}
h1{font-size:clamp(46px,9vw,84px);line-height:.95;letter-spacing:-.055em;margin:30px 0 22px;max-width:760px}
.sub{font-size:20px;line-height:1.55;color:#9fb1c5;max-width:690px}
.card{margin-top:34px;background:#0b1a2a;border:1px solid #213b55;border-radius:26px;padding:20px}
input{width:100%;padding:20px;border-radius:18px;border:1px solid #29445e;background:#071524;color:#fff;font-size:17px;outline:none}
button{border:0;border-radius:17px;padding:18px 22px;font-size:17px;font-weight:800;cursor:pointer}
.primary{width:100%;margin-top:14px;background:#35d39c;color:#061322}
.notice{color:#8196aa;font-size:14px;margin:15px 10px 0}
#result{display:none;margin-top:20px}.title{font-size:21px;font-weight:800;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.option{background:#102438;color:#dce8f3;border:1px solid #29445e}.option:hover{border-color:#35d39c}
.error{background:#351824;border:1px solid #8d3852;color:#ffc9d7;padding:16px;border-radius:15px}
.progress{margin-top:16px;color:#9fb1c5}.small{font-size:13px;color:#8196aa}
@media(max-width:600px){main{padding-top:45px}.card{padding:14px}h1{font-size:51px}.sub{font-size:18px}}
</style>
</head>
<body>
<main>
  <div class="badge">Simple · Fast · Mobile friendly</div>
  <h1>Download public videos in a few clicks.</h1>
  <div class="sub">Paste a supported public video link. VGSAVE detects the media and shows only download options that are actually available.</div>

  <section class="card">
    <input id="url" type="url" autocomplete="off" placeholder="Paste public video URL">
    <button id="detect" class="primary">Get Download</button>
    <div class="notice">Only download content you own or have permission to download.</div>
  </section>

  <section id="result" class="card"></section>
</main>

<script>
const $=s=>document.querySelector(s);
const result=$("#result"), input=$("#url"), detectBtn=$("#detect");

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

async function api(path,opts){
  const r=await fetch(path,opts);
  let d={}; try{d=await r.json()}catch{}
  if(!r.ok) throw new Error(d.detail||"Request failed");
  return d;
}

async function start(kind,quality){
  result.style.display="block";
  result.innerHTML='<div class="progress">Preparing download…</div>';
  try{
    const d=await api("/api/download",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({url:input.value.trim(),kind,quality})});
    let done=false;
    while(!done){
      await new Promise(r=>setTimeout(r,1200));
      const s=await api("/api/status/"+encodeURIComponent(d.id));
      result.innerHTML=`<div class="progress">Preparing download… ${s.progress||0}%</div>`;
      if(s.status==="finished"){
        done=true;
        result.innerHTML=`<div class="title">Your file is ready</div>
          <a href="/api/file/${encodeURIComponent(d.id)}" download><button class="primary">Download file</button></a>`;
      }
      if(s.status==="error") throw new Error(s.error||"Download failed");
    }
  }catch(e){result.innerHTML=`<div class="error">${esc(e.message)}</div>`}
}

detectBtn.onclick=async()=>{
  const url=input.value.trim();
  if(!url){result.style.display="block";result.innerHTML='<div class="error">Paste a public video URL first.</div>';return}
  detectBtn.disabled=true; detectBtn.textContent="Checking…";
  result.style.display="block"; result.innerHTML='<div class="progress">Checking the link…</div>';
  try{
    const d=await api("/api/detect",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({url})});
    let html=`<div class="title">${esc(d.title)}</div><div class="small">${esc(d.extractor||"Supported media")}</div><div style="height:14px"></div><div class="grid">`;
    for(const q of d.video||[]) html+=`<button class="option" data-q="${q}">${q} MP4</button>`;
    html+=`<button class="option" data-audio="1">MP3</button></div>`;
    result.innerHTML=html;
    result.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>start("video",b.dataset.q));
    result.querySelector("[data-audio]").onclick=()=>start("audio","best");
  }catch(e){result.innerHTML=`<div class="error">${esc(e.message)}</div>`}
  finally{detectBtn.disabled=false;detectBtn.textContent="Get Download"}
};
</script>
</body>
</html>
