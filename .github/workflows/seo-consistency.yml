name: SEO consistency check

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  seo-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Check repository
        uses: actions/checkout@v4

      - name: Validate public guide SEO
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import re

          public = Path("public")
          guides_dir = public / "guides"

          guide_files = sorted(guides_dir.glob("*.html"))
          assert guide_files, "No guide pages found"

          sitemap = ET.parse(public / "sitemap.xml").getroot()
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          sitemap_urls = {
              (node.find("sm:loc", ns).text or "").rstrip("/")
              for node in sitemap.findall("sm:url", ns)
          }

          expected = {"https://vgsave.pages.dev/guides"}
          errors = []

          hub = (public / "guides.html").read_text(encoding="utf-8")
          for label, needle in {
              "guides hub canonical": '<link rel="canonical" href="https://vgsave.pages.dev/guides/">',
              "guides hub description": '<meta name="description"',
              "guides hub breadcrumb": '"@type":"BreadcrumbList"',
          }.items():
              if needle not in hub:
                  errors.append(f"public/guides.html: missing {label}")

          for path in guide_files:
              html = path.read_text(encoding="utf-8")
              slug = path.stem
              url = f"https://vgsave.pages.dev/guides/{slug}"

              checks = {
                  "canonical": f'<link rel="canonical" href="{url}/">',
                  "description": '<meta name="description"',
                  "robots": '<meta name="robots" content="index,follow">',
                  "og:type": '<meta property="og:type"',
                  "og:site_name": '<meta property="og:site_name"',
                  "og:title": '<meta property="og:title"',
                  "og:description": '<meta property="og:description"',
                  "og:url": f'<meta property="og:url" content="{url}/">',
                  "og:locale": '<meta property="og:locale"',
                  "twitter:card": '<meta name="twitter:card"',
                  "twitter:title": '<meta name="twitter:title"',
                  "twitter:description": '<meta name="twitter:description"',
                  "breadcrumb": '"@type":"BreadcrumbList"',
              }

              for label, needle in checks.items():
                  if needle not in html:
                      errors.append(f"{path}: missing {label}")

              if url not in sitemap_urls:
                  errors.append(f"{path}: missing from sitemap.xml")

              guide_links = html.count('href="/guides/')
              if guide_links < 2:
                  errors.append(f"{path}: fewer than 2 internal guide links ({guide_links})")

              expected.add(url)

          missing = sorted(expected - sitemap_urls)
          for url in missing:
              errors.append(f"sitemap.xml: missing expected URL {url}")

          # Keep FastAPI's public-page registry synchronized with the static guide files.
          main_py = (Path("app") / "main.py").read_text(encoding="utf-8")
          marker = "PUBLIC_PAGES = {"
          if marker not in main_py:
              errors.append("app/main.py: PUBLIC_PAGES registry not found")
          else:
              registry = main_py.split(marker, 1)[1].split("}", 1)[0]
              for line in registry.splitlines():
                  if '"/guides/' not in line or ':' not in line:
                      continue
                  route = line.split(":", 1)[0].strip().strip('"')
                  target = line.split(":", 1)[1].strip().strip(",").strip().strip('"')
                  if route.startswith("/guides/") and target:
                      target_path = public / target
                      if not target_path.is_file():
                          errors.append(f"app/main.py: PUBLIC_PAGES target missing for {route}: {target}")

          redirects = (public / "_redirects").read_text(encoding="utf-8")
          for path in sorted(expected):
              if path == "https://vgsave.pages.dev/":
                  continue
              route = "/" + path.removeprefix("https://vgsave.pages.dev/").rstrip("/") + "/"
              if not any(line.startswith(route + " ") for line in redirects.splitlines()):
                  errors.append(f"_redirects: missing route {route}")

          for url in sorted(sitemap_urls):
              if url.startswith("https://vgsave.pages.dev/guides/") and url != "https://vgsave.pages.dev/guides":
                  slug = url.rsplit("/", 1)[-1]
                  if not (guides_dir / f"{slug}.html").is_file():
                      errors.append(f"sitemap.xml: guide URL has no matching file: {url}")

          duplicate_urls = []
          all_locs = [
              (node.find("sm:loc", ns).text or "").rstrip("/")
              for node in sitemap.findall("sm:url", ns)
          ]
          seen = set()
          for url in all_locs:
              if url in seen:
                  duplicate_urls.append(url)
              seen.add(url)

          for url in duplicate_urls:
              errors.append(f"sitemap.xml: duplicate URL {url}")

          if errors:
              print("\n".join(errors))
              raise SystemExit(1)

          print(f"SEO consistency OK: {len(guide_files)} guide pages checked.")
          print(f"Sitemap URLs checked: {len(all_locs)}")
          PY
