name: Production smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check public pages
        run: |
          set -e
          for url in \
            "https://vgsave.pages.dev/" \
            "https://vgsave.pages.dev/guides/" \
            "https://vgsave.pages.dev/guides/instagram-reels-downloader/" \
            "https://vgsave.pages.dev/guides/instagram-video-downloader/" \
            "https://vgsave.pages.dev/guides/instagram-story-downloader/" \
            "https://vgsave.pages.dev/guides/youtube-video-downloader/" \
            "https://vgsave.pages.dev/guides/youtube-mp3-downloader/" \
            "https://vgsave.pages.dev/guides/youtube-1080p-downloader/" \
            "https://vgsave.pages.dev/guides/tiktok-video-downloader/" \
            "https://vgsave.pages.dev/guides/tiktok-mp4-downloader/" \
            "https://vgsave.pages.dev/guides/4k-video-downloader/" \
            "https://vgsave.pages.dev/guides/facebook-video-downloader/" \
            "https://vgsave.pages.dev/guides/twitter-video-downloader/" \
            "https://vgsave.pages.dev/guides/youtube-4k-video-downloader/" \
            "https://vgsave.pages.dev/guides/instagram-mp4-downloader/" \
            "https://vgsave.pages.dev/guides/facebook-mp4-downloader/" \
            "https://vgsave.pages.dev/guides/twitter-x-mp4-downloader/" \
            "https://vgsave.pages.dev/guides/tiktok-video-downloader-without-app/" \
            "https://vgsave.pages.dev/guides/video-download/" \
            "https://vgsave.pages.dev/guides/mp3/" \
            "https://vgsave.pages.dev/guides/video-quality/" \
            "https://vgsave.pages.dev/guides/responsible-downloading/" \
            "https://vgsave.pages.dev/guides/youtube-public-video-download/" \
            "https://vgsave.pages.dev/guides/instagram-public-video-download/" \
            "https://vgsave.pages.dev/guides/download-public-video-android/" \
            "https://vgsave.pages.dev/guides/download-public-video-pc/" \
            "https://vgsave.pages.dev/guides/download-public-video-iphone/" \
            "https://vgsave.pages.dev/guides/troubleshooting/" \
            "https://vgsave.pages.dev/guides/online-video-downloader/" \
            "https://vgsave.pages.dev/guides/mp4-video-downloader/" \
            "https://vgsave.pages.dev/guides/youtube-shorts-downloader/" \
            "https://vgsave.pages.dev/robots.txt" \
            "https://vgsave.pages.dev/sitemap.xml"; do
            echo "Checking $url"
            curl --fail --silent --show-error --location --max-time 20 -o /dev/null "$url"
          done

      - name: Check custom 404
        run: |
          set -e
          status="$(curl --silent --show-error --location --max-time 20 -o /tmp/vgsave-404.html -w '%{http_code}' 'https://vgsave.pages.dev/launch-smoke-test-not-found')"
          test "$status" = "404"
          grep -qi "Page not found" /tmp/vgsave-404.html
